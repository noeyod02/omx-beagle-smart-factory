# Layout for station B: the destination side of the relay.
#
# The arm here takes the part off the Beagle's tray and drops it at the final
# destination - whichever stock bin was reported empty. It has no warehouse of
# its own: every part it places arrived on the carrier. The camera watching
# these bins also lives at this station. See stock_layout_a.yaml for the
# warehouse side.
#
# All robot coordinates are in metres in THIS arm's link0 (base) frame:
#   +x forward from the base, +y to the robot's left, +z up.
# These numbers share nothing with station A's; each arm has its own base.
#
# Measure with scripts/stock_jog.py, pointed at station B's controllers - its
# defaults address an arm outside a namespace, so without these it will not
# find either arm of a relay:
#
#   ros2 run open_manipulator_playground stock_jog.py \
#     --arm-action /station_b/arm_controller/follow_joint_trajectory \
#     --gripper-action /station_b/gripper_controller/gripper_cmd
#
# Press p over each point to record it, q to print them all as YAML.

workspace:
  # Single via point the arm passes through between picking and placing.
  # Kept deliberately high (z=0.18): the carry from the tray to the cells
  # passes over the Beagle, and a low transit once clipped a part on its
  # wheel. Moved 2026-08-20 onto the direct arc between the new carrier
  # (azimuth -37) and the cells (bin_a at -67): the old point sat at -19,
  # on the far side of the carrier, so every carry swung counter-clockwise
  # away from the cells before coming back. At -54 the arm now leaves the
  # tray already heading toward the cells.
  # Run scripts/stock_reach_check.py after editing any coordinate here.
  transit: {x: 0.11, y: -0.165, z: 0.18}
  # Height the gripper hovers above a target before descending onto it.
  #
  # 0.03. This was squeezed to 0.008 while the tray sat at radial 0.215,
  # where the solver had nothing left above the grasp; moving the arm base
  # 2-3 cm toward the bay (2026-08-06) brought the tray to 0.194 and bought
  # the height back. Every centimetre of hover still costs about 3 cm of
  # reach - re-check with scripts/stock_reach_check.py before raising it.
  hover_height: 0.03
  # Approach angle of the gripper, in degrees. -90 points straight down.
  # Tilted from -90 on 2026-08-07 to stretch top-down reach: at bin height
  # straight-down runs out at 0.254 m radius, -60 reaches 0.320 m.
  #
  # These are the DEFAULTS. Any point below may carry its own pitch_deg and
  # roll_deg - stock_jog.py records them when a point is posed in joint mode -
  # and the task manager and reach check then use the point's own angles.
  # A point without them is solved at these values, so it must have been
  # taught at them (stock_jog.py --pitch-deg -60).
  approach_pitch_deg: -60.0
  # Roll of the gripper about its approach axis, in degrees.
  approach_roll_deg: 0.0
  # Pose the arm returns to between jobs. Keep it out of the camera's view of
  # the bins, and clear of the bay so the Beagle can drive in and out.
  home: {x: 0.124, y: 0.0, z: 0.15}

  # Hard limits; every waypoint is checked against these at startup.
  # x reaches below zero since 2026-08-20: cell b was taught at x=-0.036,
  # around the side of the base (j1 at -98). The j1 wrap fix in
  # omx_kinematics is what makes such points replay sanely.
  limits:
    x: [-0.06, 0.28]
    y: [-0.20, 0.20]
    z: [0.02, 0.22]

  # Seconds allowed for each kind of motion. Slower is safer for a first run.
  durations:
    transit: 3.0
    approach: 2.0
    descend: 2.0
    gripper: 1.0

# See stock_layout_a.yaml for how the conversion was measured:
#     gap_mm = 100 * joint + 10
#
# Both values replace the 0.40/0.15 this file started with, which suited a
# 30 mm part that is not the part this cell moves.
#
# open_position matches station A, which was set against the real part. 50 mm
# was not enough to go around it: the jogger had the jaws at 90 mm to clear it
# on the tray, so a job starting from 50 mm would have brought the fingers down
# onto the part rather than around it.
#
# closed_position is the one to watch. Station A commands 0.15 - 25 mm - at a
# part that measures about 38 mm under grasp, so it spends the whole carry
# squeezing 13 mm past the part instead of holding it, and a smooth face
# eventually squirts out. 0.27 asks for 37 mm, which stalls against the part
# with a millimetre of squeeze rather than crushing through it.
#
# 0.32 comes from this gripper closing on this part at this station, on
# 2026-08-06: commanded 0.27, the jaws stalled at 0.34 - 44 mm - and held there
# for the nine seconds of the carry. Then the width slid the rest of the way to
# the commanded 0.27 in 50 ms and the part was gone. Seven millimetres of
# squeeze past a smooth face is all it takes.
#
# So the number to command is just under the width the part actually stops the
# jaws at, not a width derived from the part elsewhere: station A grips the
# same part lying in the warehouse box and stalls at 0.288, because it takes
# hold of it in a different place.
#
# Check it against the width trace: from the close to the release the reading
# should sit near 0.34 and not move. A reading that reaches the commanded 0.32
# means the jaws closed on nothing, or on nothing any more.
gripper:
  # Re-sized in the jog against the real part on 2026-08-20 (session block
  # pasted verbatim). Watch the first grasps: if the carry width slides all
  # the way down to 34 mm the jaws closed on nothing - or squeezed the part
  # out - and this is the number to revisit.
  open_position: 0.76    # 86 mm
  closed_position: 0.24  # 34 mm
  max_effort: 10.0

# Where the part is lifted off the Beagle's tray, in THIS arm's frame.
#
# Taught 2026-08-06 as 'pgrip3' with scripts/stock_jog.py, against the pose
# the 0.67 m route actually leaves the carrier in, and after the arm base was
# moved 2-3 cm toward the bay - the move that pulled the tray in from radial
# 0.215 to 0.194 and gave the carry its height back. Any earlier B coordinate
# predates that move and describes a base that no longer exists. It shares
# nothing with station A's tray point even though it is the same tray: the
# two are measured from different bases.
#
# Valid only for the pose the drive leaves the carrier in. The route to bay B
# ends on dead reckoning with no docking step, so a carrier that arrives
# rotated puts the tray somewhere this coordinate does not describe - which is
# what a failed grasp here will mean before anything else.
#
# The relay refuses to reach for the tray unless the Beagle reports
# ready_for_arm, so a carrier parked short of the bay is never grasped into.
carrier:
  # Re-taught 2026-08-20 as 'carrierb' against the new L route, which parks
  # the tray rotated +90 from the old bay - hence the wrist roll. Valid only
  # for the pose that route actually produces.
  transfer: {x: 0.1835, y: -0.1489, z: 0.1594, pitch_deg: -60.0, roll_deg: 50.0}

# Station B fetches from the carrier, never from a warehouse.
warehouse:
  pick_points: []

# The destination cells - every part is lifted off the carrier tray (the one
# pick point above) and placed into whichever of these was asked for.
#   place: where the gripper releases a part into it, in robot coordinates.
#          May carry pitch_deg/roll_deg (see approach_pitch_deg above).
#   roi:   the cell's rectangle in the camera image [x1, y1, x2, y2], in
#          pixels. Fill this in with scripts/stock_calibrate.py.
#
# Only points a gripper has actually been driven to belong here: the invented
# coordinates this file once carried passed the reach check and would have
# failed at the box. Teach each cell with the jog pointed at station B
# (command at the top of this file), save it under the cell's name, then copy
# the line from ~/.ros/stock_points_b.yaml into its entry here and rerun
# scripts/stock_reach_check.py.
bins:
  # Taught 2026-08-06 (fourth pass, after the arm base moved) as 'drop' for
  # what was then the only destination box, down inside it rather than
  # releasing from the air above, so the part is set in rather than dropped.
  # The jaws open to 86 mm at this depth, so the cell mouth has to clear that.
  # RE-VERIFY against cell a before trusting it: the coordinate predates the
  # three-cell arrangement, and an empty run to it proves nothing has moved.
  #
  # The rois are still placeholders: the camera at this station has not been
  # aimed or calibrated, so nothing reads them yet.
  # Re-taught 2026-08-20 for the four-cell arrangement (B owns a and b),
  # posed in joint mode at straight-down pitch with the jaws rolled 20 to
  # line up with the cell. Taken from the jog's readout - the 'bin a' save
  # was refused over the space in the name, but the pose on screen was the
  # taught one and IK reproduces its joints to 0.1 deg.
  - id: bin_a
    place: {x: 0.066, y: -0.188, z: 0.088, pitch_deg: -90.0, roll_deg: 20.0}
    roi: [80, 90, 200, 210]
  # Station B owns cells a and b only; cells c and d belong to station C's
  # arm (stock_layout_c.yaml, on PC2).
  # Taught 2026-08-20 as 'binb', straight down with no roll, around the
  # side of the base at j1 -98 - hence the widened x limit above.
  - id: bin_b
    place: {x: -0.0364, y: -0.1702, z: 0.0622, pitch_deg: -90.0, roll_deg: 0.0}
    roi: [0, 0, 0, 0]
